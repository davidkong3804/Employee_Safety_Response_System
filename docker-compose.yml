services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: safety_response
      POSTGRES_USER: app
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d safety_response"]
      interval: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  # One-shot: create tables + seed demo data, then exit.
  # Mirrors the Kubernetes db-init Job so startup behaviour matches prod.
  backend-init:
    build: ./backend
    image: safety-response-backend:dev
    command: ["python", "-m", "app.init_db", "--seed"]
    environment:
      DATABASE_URL: postgresql+asyncpg://app:devpassword@db:5432/safety_response
    depends_on:
      db:
        condition: service_healthy

  backend:
    build: ./backend
    image: safety-response-backend:dev
    # Dev override: hot-reload. The image's default CMD has no --reload (prod).
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://app:devpassword@db:5432/safety_response
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-secret-key-change-in-production
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend-init:
        condition: service_completed_successfully
    volumes:
      - ./backend/app:/app/app

  # Production-style build: SPA compiled to static assets, served by nginx.
  # nginx reverse-proxies /api to the backend (same-origin, so no CORS).
  # For frontend hot-reload during development, run `pnpm dev` on the host.
  frontend:
    build: ./frontend
    ports:
      - "5173:8080"
    depends_on:
      - backend

  prometheus:
    image: prom/prometheus:v2.55.1
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus-rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:11.3.2
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus

volumes:
  pgdata:
  prometheus_data:
  grafana_data:
