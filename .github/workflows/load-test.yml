name: Locust Load Test → GKE

on:
  workflow_dispatch:
    inputs:
      users:
        description: 'Concurrent users (ignored when shape != default)'
        default: '50'
      duration:
        description: 'Duration (e.g. 2m, 5m, 10m). Ignored when shape != default'
        default: '2m'
      spawn_rate:
        description: 'Users spawned per second (ignored when shape != default)'
        default: '5'
      shape:
        description: 'Load profile: default | linear | exp'
        default: 'default'
        type: choice
        options:
          - default
          - linear
          - exp
      peak_users:
        description: 'Peak users for linear/exp ramp (Locust simulates this; with 0.2-0.6s wait_time, 500 ≈ 2000 traditional VUs)'
        default: '500'
      ramp_sec:
        description: 'Ramp duration in seconds (linear/exp)'
        default: '120'
      hold_sec:
        description: 'Hold duration in seconds at peak (linear/exp)'
        default: '180'

jobs:
  load-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      HOST: https://employee-safety.duckdns.org

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: safety-response
          location: asia-east1-a

      - name: Get Ingress external IP
        run: kubectl -n safety-system get ingress safety-system

      - name: Check backend health
        run: curl -fsS "$HOST/health"

      # 關鍵在這——zope.event / zope.interface 一定要先裝
      - name: Install Locust
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir zope.event zope.interface
          pip install --no-cache-dir locust==2.34.0
          locust --version

      - name: Run load test
        # Don't fail the workflow on Locust's own exit code — any failed
        # request makes Locust return 1. We re-evaluate the result in the
        # "Evaluate result" step below, treating expected 429 (rate limiter)
        # as a pass condition.
        continue-on-error: true
        env:
          # LoadTestShape picks these up at startup. When SHAPE=default the
          # shape class is a no-op and Locust uses --users / --spawn-rate.
          LOAD_TEST_SHAPE: ${{ inputs.shape }}
          LOAD_TEST_PEAK_USERS: ${{ inputs.peak_users }}
          LOAD_TEST_RAMP_SEC: ${{ inputs.ramp_sec }}
          LOAD_TEST_HOLD_SEC: ${{ inputs.hold_sec }}
        run: |
          mkdir -p reports

          if [ "${{ inputs.shape }}" = "default" ]; then
            # Original behavior: caller-controlled VU count + ramp.
            locust -f tests/performance/locustfile.py \
              --headless \
              --host "$HOST" \
              --users ${{ inputs.users }} \
              --spawn-rate ${{ inputs.spawn_rate }} \
              --run-time ${{ inputs.duration }} \
              --html reports/loadtest.html \
              --csv reports/loadtest \
              --only-summary
          else
            # Shape-driven: LoadTestShape owns user count + spawn rate.
            # Total wall-clock = ramp + hold; add 30s safety margin.
            RUN_TIME=$(( ${{ inputs.ramp_sec }} + ${{ inputs.hold_sec }} + 30 ))
            echo "Using LoadTestShape='${{ inputs.shape }}', total ${RUN_TIME}s"
            locust -f tests/performance/locustfile.py \
              --headless \
              --host "$HOST" \
              --run-time ${RUN_TIME}s \
              --html reports/loadtest.html \
              --csv reports/loadtest \
              --only-summary
          fi

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: locust-report-${{ github.run_number }}
          path: reports/

      - name: Print summary
        if: always()
        run: |
          echo "## Load Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Host: $HOST" >> $GITHUB_STEP_SUMMARY
          echo "- Users: ${{ inputs.users }}" >> $GITHUB_STEP_SUMMARY
          echo "- Duration: ${{ inputs.duration }}" >> $GITHUB_STEP_SUMMARY
          if [ -f reports/loadtest_stats.csv ]; then
            echo "### Stats" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat reports/loadtest_stats.csv >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Evaluate result (exclude expected 429 rate-limited responses)
        # Real failure = total failures - 429s. Pass if real failure rate < 1%.
        # This lets the workflow turn green when the only "failures" are the
        # rate limiter doing its job (e.g. Locust hammering POST /remind faster
        # than the 3-per-60s sliding window allows).
        if: always()
        run: |
          if [ ! -f reports/loadtest_stats.csv ]; then
            echo "::error::No stats csv produced — load test did not run"
            exit 1
          fi
          if [ ! -f reports/loadtest_failures.csv ]; then
            # No failures file means zero failures — pass.
            echo "✅ No failures recorded — pass"
            exit 0
          fi

          # Count 429 occurrences (rate-limited; expected protection)
          RATE_LIMITED=$(awk -F',' 'NR>1 && /429/ {gsub("\r",""); s+=$NF} END{print s+0}' reports/loadtest_failures.csv)

          # Read totals from Aggregated row of stats.csv
          TOTAL=$(awk -F',' '$2=="Aggregated" {print $3}'  reports/loadtest_stats.csv)
          FAILS=$(awk -F',' '$2=="Aggregated" {print $4}'  reports/loadtest_stats.csv)

          REAL_FAILS=$((FAILS - RATE_LIMITED))
          # bash arithmetic, scaled to keep one decimal for percentages
          REAL_PCT=$(awk -v f=$REAL_FAILS -v t=$TOTAL 'BEGIN{printf "%.2f", (t>0 ? f*100.0/t : 0)}')

          {
            echo "### Pass/fail evaluation"
            echo "- Total requests:        $TOTAL"
            echo "- Total failures:        $FAILS"
            echo "- Of which 429 (expected): $RATE_LIMITED"
            echo "- Real failures:         $REAL_FAILS"
            echo "- Real failure rate:     ${REAL_PCT}%"
            echo "- Threshold:             < 1.00%"
          } >> $GITHUB_STEP_SUMMARY

          # Compare REAL_PCT < 1.00 using awk (bash can't do float compare)
          if awk -v p=$REAL_PCT 'BEGIN{exit !(p < 1.0)}'; then
            echo "✅ Real failure rate ${REAL_PCT}% < 1% — PASS"
            exit 0
          else
            echo "::error::Real failure rate ${REAL_PCT}% ≥ 1% — FAIL"
            exit 1
          fi
