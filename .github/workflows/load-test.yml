name: Locust Load Test → GKE

on:
  workflow_dispatch:
    inputs:
      users:
        description: 'Concurrent users'
        default: '50'
      duration:
        description: 'Duration (e.g. 2m, 5m, 10m)'
        default: '2m'
      spawn_rate:
        description: 'Users spawned per second'
        default: '5'

jobs:
  load-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      HOST: https://employee-safety.duckdns.org

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: safety-response
          location: asia-east1-a

      - name: Get Ingress external IP
        run: kubectl -n safety-system get ingress safety-system

      - name: Check backend health
        run: curl -fsS "$HOST/health"

      # 關鍵在這——zope.event / zope.interface 一定要先裝
      - name: Install Locust
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir zope.event zope.interface
          pip install --no-cache-dir locust==2.34.0
          locust --version

      - name: Run load test
        run: |
          mkdir -p reports
          locust -f tests/performance/locustfile.py \
            --headless \
            --host "$HOST" \
            --users ${{ inputs.users }} \
            --spawn-rate ${{ inputs.spawn_rate }} \
            --run-time ${{ inputs.duration }} \
            --html reports/loadtest.html \
            --csv reports/loadtest \
            --only-summary

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: locust-report-${{ github.run_number }}
          path: reports/

      - name: Print summary
        if: always()
        run: |
          echo "## Load Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Host: $HOST" >> $GITHUB_STEP_SUMMARY
          echo "- Users: ${{ inputs.users }}" >> $GITHUB_STEP_SUMMARY
          echo "- Duration: ${{ inputs.duration }}" >> $GITHUB_STEP_SUMMARY
          if [ -f reports/loadtest_stats.csv ]; then
            echo "### Stats" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat reports/loadtest_stats.csv >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
