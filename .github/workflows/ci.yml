name: CI

on:
  push:
    branches: [main, "feature/**", "fix/**"]
  pull_request:
    branches: [main]

jobs:
  # ----------------------------------------------------------------
  # Job 1: Backend unit tests (no database)
  # ----------------------------------------------------------------
  backend-unit:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/unit/ -v --tb=short

  # ----------------------------------------------------------------
  # Job 2: Backend integration tests (requires PostgreSQL)
  # ----------------------------------------------------------------
  backend-integration:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: safety_response_test
          POSTGRES_USER: app
          POSTGRES_PASSWORD: devpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+asyncpg://app:devpassword@localhost:5432/safety_response_test
      JWT_SECRET: test-secret-key

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run integration tests
        run: >
          pytest tests/integration/
          -v --tb=short
          --cov=app
          --cov-report=xml:coverage.xml
          --cov-report=term-missing

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml

  # ----------------------------------------------------------------
  # Job 3: Frontend unit tests (Vitest)
  # ----------------------------------------------------------------
  frontend-unit:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        run: npm install -g pnpm@9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests with coverage
        run: pnpm vitest run --coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/

  # ----------------------------------------------------------------
  # Job 4: E2E tests with Playwright (depends on integration + frontend)
  # ----------------------------------------------------------------
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [backend-integration, frontend-unit]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Start full stack
        run: docker compose up -d --build

      - name: Wait for backend health check
        run: |
          timeout 90 bash -c \
            'until curl -sf http://localhost:8000/health; do sleep 3; done'

      - name: Wait for frontend to be ready
        run: |
          timeout 60 bash -c 'until curl -sf http://localhost:5173; do sleep 2; done'

      - name: Install Playwright
        working-directory: tests/e2e
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: tests/e2e
        env:
          BASE_URL: http://localhost:5173
        run: npx playwright test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: tests/e2e/playwright-report/
          retention-days: 14

      - name: Tear down stack
        if: always()
        run: docker compose down

  # ----------------------------------------------------------------
  # Job 5: Build and push Docker images to Artifact Registry.
  # Runs ONLY on push to main after ALL four test jobs pass.
  #
  # Required GitHub Secret (Settings → Secrets and variables → Actions):
  #   GCP_SA_KEY  — Service Account JSON key with roles:
  #                   roles/artifactregistry.writer
  #                   roles/container.developer
  # ----------------------------------------------------------------
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: [backend-unit, backend-integration, frontend-unit, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    env:
      REGISTRY: asia-east1-docker.pkg.dev/avid-vine-496920-n4/safety-response

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker asia-east1-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          # GitHub Actions cache keeps layers warm across runs.
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
          tags: |
            ${{ env.REGISTRY }}/backend:${{ github.sha }}
            ${{ env.REGISTRY }}/backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          tags: |
            ${{ env.REGISTRY }}/frontend:${{ github.sha }}
            ${{ env.REGISTRY }}/frontend:latest

  # ----------------------------------------------------------------
  # Job 6: Rolling deploy to GKE (depends on build-and-push).
  # Runs ONLY on push to main.
  #
  # Additional required GitHub Secrets:
  #   GKE_CLUSTER  — GKE cluster name (e.g. safety-cluster)
  #   GKE_REGION   — cluster region   (e.g. asia-east1)
  # ----------------------------------------------------------------
  deploy:
    name: Deploy to GKE
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    env:
      REGISTRY: asia-east1-docker.pkg.dev/avid-vine-496920-n4/safety-response

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ secrets.GKE_CLUSTER }}
          location: ${{ secrets.GKE_REGION }}

      - name: Roll out backend
        run: |
          kubectl -n safety-system set image deployment/backend \
            backend=${{ env.REGISTRY }}/backend:${{ github.sha }}
          kubectl -n safety-system rollout status deployment/backend \
            --timeout=180s

      - name: Roll out frontend
        run: |
          kubectl -n safety-system set image deployment/frontend \
            frontend=${{ env.REGISTRY }}/frontend:${{ github.sha }}
          kubectl -n safety-system rollout status deployment/frontend \
            --timeout=180s
