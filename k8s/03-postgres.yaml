# Single-instance PostgreSQL for a self-contained demo deployment.
# For real production on GKE prefer Cloud SQL for PostgreSQL (managed backups,
# HA, automatic failover) and point DATABASE_URL at it instead.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: safety-system
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: safety-system
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          # Raise max_connections to comfortably cover all backend pods.
          # 60 pods x (3 + 2 pool) = 300; bump to 350 to leave headroom for
          # psql admin connections, k8s probes, and the db-init Job.
          args: ["-c", "max_connections=350"]
          env:
            - name: POSTGRES_DB
              value: safety_response
            - name: POSTGRES_USER
              value: app
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "app", "-d", "safety_response"]
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "app", "-d", "safety_response"]
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        # pd-standard (HDD) — keeps us under the much smaller SSD_TOTAL_GB
        # regional quota that the GKE Standard default would otherwise hit.
        storageClassName: standard
        resources:
          requests:
            storage: 5Gi
