apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend
  namespace: safety-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 1
  # Stress-test ceiling. Real headroom depends on the project's
  # CPUS_ALL_REGIONS quota and the cluster-autoscaler max nodes; with
  # the current 2-4 e2-medium pool (~3.4 GB usable mem/node) we can fit
  # ~40 backend pods @ 192Mi req each. Bump to 50 after quota increase
  # raises the cross-region CPU cap.
  maxReplicas: 30
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      # Disaster scenarios produce sub-minute traffic spikes (~1000 logins
      # in 60 seconds). Shrink the stabilization window and let HPA bring
      # in many pods per evaluation cycle so cluster autoscaler also
      # provisions nodes early.
      stabilizationWindowSeconds: 0
      policies:
        # Up to 4 pods per 15s (4 + 8 + 16 ... = ~30 pods within ~75s).
        - type: Pods
          value: 4
          periodSeconds: 15
        # Or double the replicas, whichever is more aggressive.
        - type: Percent
          value: 100
          periodSeconds: 15
      selectPolicy: Max
    scaleDown:
      # Disaster traffic is spiky — scale down slowly to avoid flapping.
      stabilizationWindowSeconds: 180
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
