apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend
  namespace: safety-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  # minReplicas=3: pre-warm 3 pods so disaster traffic isn't funnelled
  # through a single pod during the first HPA evaluation cycle (~25s).
  minReplicas: 3
  # maxReplicas=60: 60 pods × 3 connections = 180 total DB connections,
  # within postgres max_connections=350 until PgBouncer is deployed.
  # Raise further after PgBouncer is in place (pool_size can then go to 10+5).
  maxReplicas: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          # Lower threshold (60%) triggers scale-up earlier, leaving headroom
          # for burst I/O that doesn't show up as CPU until connections saturate.
          averageUtilization: 60
  behavior:
    scaleUp:
      # Disaster scenarios produce sub-minute traffic spikes (~1000 logins
      # in 60 seconds). Shrink the stabilization window and let HPA bring
      # in many pods per evaluation cycle so cluster autoscaler also
      # provisions nodes early.
      stabilizationWindowSeconds: 0
      policies:
        # Up to 4 pods per 15s (4 + 8 + 16 ... = ~30 pods within ~75s).
        - type: Pods
          value: 4
          periodSeconds: 15
        # Or double the replicas, whichever is more aggressive.
        - type: Percent
          value: 100
          periodSeconds: 15
      selectPolicy: Max
    scaleDown:
      # Disaster traffic is spiky — scale down slowly to avoid flapping.
      stabilizationWindowSeconds: 180
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
