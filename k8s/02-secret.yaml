# Sensitive backend configuration.
#
# WARNING — these are development placeholder values. Do NOT use them in a
# real deployment and do NOT commit real secrets to git. For production use
# GCP Secret Manager + the Secrets Store CSI driver, or Sealed Secrets, and
# generate JWT_SECRET with e.g. `openssl rand -hex 32`.
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: safety-system
type: Opaque
stringData:
  JWT_SECRET: "dev-only-change-me-to-a-long-random-string"
  POSTGRES_PASSWORD: "devpassword"
  # asyncpg URL consumed by the backend and the db-init job.
  DATABASE_URL: "postgresql+asyncpg://app:devpassword@postgres:5432/safety_response"
