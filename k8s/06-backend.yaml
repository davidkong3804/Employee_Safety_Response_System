apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: safety-system
  annotations:
    # Container-native load balancing (NEG) so the GKE Ingress routes
    # straight to pods instead of bouncing through kube-proxy.
    cloud.google.com/neg: '{"ingress": true}'
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: safety-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: backend
          image: asia-east1-docker.pkg.dev/avid-vine-496920-n4/safety-response/backend:v1
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secret
          # Liveness: process is up. Cheap, no DB dependency — a DB blip
          # must not trigger a pod restart.
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          # Readiness: only receive traffic when the DB is reachable.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              # Sized for stress-test density: 30+ pods on a 2-4 e2-medium
              # pool. FastAPI + asyncpg pool baseline is ~120-140 MB; 192Mi
              # gives ~50 MB headroom before the 384Mi limit kicks in.
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 384Mi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend
  namespace: safety-system
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: backend
