apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: safety-system
  annotations:
    # Container-native load balancing (NEG) so the GKE Ingress routes
    # straight to pods instead of bouncing through kube-proxy.
    cloud.google.com/neg: '{"ingress": true}'
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: safety-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: backend
      annotations:
        # Tell Managed Prometheus (GKE built-in) to scrape this pod's
        # /metrics endpoint exposed by prometheus-fastapi-instrumentator.
        # The /metrics path lives on the backend container (port 8000)
        # and is excluded from the OpenAPI schema (include_in_schema=False
        # in main.py).
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      # Give Kubernetes 40s to fully drain a pod during rollouts. The preStop
      # sleep below uses 5s of that; the remaining 35s covers in-flight HTTP
      # requests and asyncpg connection close. Default 30s was occasionally
      # leaving sub-1% of requests with 502s during rolling deploys.
      terminationGracePeriodSeconds: 40
      # Spread backend pods across zones so a single-zone failure can't take
      # down the whole tier. `ScheduleAnyway` (soft) means we never block
      # scheduling when an HPA scale-up needs more pods than zones have
      # capacity for — eventual consistency wins over hard correctness here.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: backend
      containers:
        - name: backend
          image: asia-east1-docker.pkg.dev/avid-vine-496920-n4/safety-response/backend:v1
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secret
          # preStop sleep gives the GKE Ingress NEG controller time to mark
          # this endpoint NotReady and stop sending new requests before the
          # container receives SIGTERM. Without this, NEG keeps routing to a
          # pod that's already shutting down, producing 5xx during deploys.
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          # Liveness: process is up. Cheap, no DB dependency — a DB blip
          # must not trigger a pod restart.
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          # Readiness: only receive traffic when the DB is reachable.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              # Sized for stress-test density: 30+ pods on a 2-4 e2-medium
              # pool. FastAPI + asyncpg pool baseline is ~120-140 MB; 192Mi
              # gives ~50 MB headroom before the 384Mi limit kicks in.
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 384Mi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend
  namespace: safety-system
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: backend
