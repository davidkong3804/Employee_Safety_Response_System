# PgBouncer connection pooler — transaction mode.
#
# Sits between backend pods and PostgreSQL, multiplexing up to 2000 client
# connections per pod into ~50 real server connections. This allows the HPA
# to scale backend pods beyond the DB max_connections ceiling without risk.
#
# Capacity math (post-A2 sizing):
#   - 3-6 pgbouncer pods × 2000 max_client_conn = 6,000-12,000 client slots
#   - 3-6 pgbouncer pods × 50 default_pool_size = 150-300 server conns
#   - Cloud SQL max_connections=400 flag leaves 100-250 headroom for
#     direct/admin connections that bypass pgbouncer.
#
# After deploying this file, update k8s/02-secret.yaml.example:
#   DATABASE_URL → postgresql+asyncpg://app:<pw>@pgbouncer:5432/safety_response
# and raise the pool in k8s/01-configmap.yaml:
#   DB_POOL_SIZE=10, DB_MAX_OVERFLOW=5
#
# bitnami/pgbouncer auto-generates userlist.txt from POSTGRESQL_PASSWORD,
# so no separate secret hashing step is needed.
apiVersion: v1
kind: ConfigMap
metadata:
  name: pgbouncer-config
  namespace: safety-system
data:
  PGBOUNCER_POOL_MODE: "transaction"
  # Bumped 1000 → 2000 per pod (A2). Under spike test HPA can land 50+
  # backend pods × 15 (pool+overflow) = 750+ client conns per bouncer pod
  # if traffic is uneven; 2000 absorbs that without `cl_waiting` queueing.
  PGBOUNCER_MAX_CLIENT_CONN: "2000"
  PGBOUNCER_DEFAULT_POOL_SIZE: "100"
  PGBOUNCER_MIN_POOL_SIZE: "5"
  PGBOUNCER_RESERVE_POOL_SIZE: "10"
  PGBOUNCER_RESERVE_POOL_TIMEOUT: "5"
  PGBOUNCER_SERVER_LIFETIME: "3600"
  PGBOUNCER_SERVER_IDLE_TIMEOUT: "600"
  # Suppress per-connection noise; log pool errors only.
  PGBOUNCER_LOG_CONNECTIONS: "0"
  PGBOUNCER_LOG_DISCONNECTIONS: "0"
  PGBOUNCER_LOG_POOLER_ERRORS: "1"
  # Enable prepared-statement support in transaction-mode pooling.
  # Without this, asyncpg's per-connection prepared statement cache collides
  # whenever PgBouncer assigns the next transaction to a different server
  # connection — producing `DuplicatePreparedStatementError __asyncpg_stmt_N__`
  # under any non-trivial load. PgBouncer 1.21+ tracks PREPARE/EXECUTE/DEALLOCATE
  # per client, replaying them on whatever server connection it routes to.
  # 200 is comfortably above SQLAlchemy + asyncpg working-set size.
  PGBOUNCER_MAX_PREPARED_STATEMENTS: "200"
  # Stage 3-B: upstream switched from in-cluster postgres to cloudsql-proxy,
  # which fronts the Cloud SQL HA instance via Workload Identity + private IP.
  POSTGRESQL_HOST: "cloudsql-proxy"
  POSTGRESQL_PORT: "5432"
  POSTGRESQL_DATABASE: "safety_response"
  POSTGRESQL_USERNAME: "app"
  # Make the client-facing alias match the backend dbname so clients can
  # connect with "safety_response" (otherwise Bitnami defaults the alias to "postgres").
  PGBOUNCER_DATABASE: "safety_response"
---
# Headless ClusterIP so backend pods resolve "pgbouncer" to one of the two
# bouncer pods via kube-proxy round-robin.
apiVersion: v1
kind: Service
metadata:
  name: pgbouncer
  namespace: safety-system
spec:
  selector:
    app: pgbouncer
  ports:
    - port: 5432
      targetPort: 6432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgbouncer
  namespace: safety-system
spec:
  # Baseline raised 2 → 3 (A2). HPA in k8s/12a-pgbouncer-hpa.yaml takes
  # this up to 6 under load. Three replicas at idle keeps spare multiplexing
  # capacity available the moment a spike starts — HPA needs ~30s to
  # observe CPU before kicking new replicas, which is enough time to
  # already be queueing at the bouncer.
  replicas: 3
  selector:
    matchLabels:
      app: pgbouncer
  template:
    metadata:
      labels:
        app: pgbouncer
    spec:
      # Disable K8s service env injection — the Service is also named "pgbouncer",
      # so K8s would inject PGBOUNCER_PORT=tcp://<ip>:5432 which collides with the
      # Bitnami entrypoint's PGBOUNCER_PORT integer check.
      enableServiceLinks: false
      # Spread the 2 pgbouncer pods across zones — if both ended up on
      # the same node the whole DB path dies with that node.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: pgbouncer
      containers:
        - name: pgbouncer
          image: bitnamilegacy/pgbouncer:1.23.1
          envFrom:
            - configMapRef:
                name: pgbouncer-config
          env:
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: POSTGRES_PASSWORD
          ports:
            - containerPort: 6432
          readinessProbe:
            tcpSocket:
              port: 6432
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 6432
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
