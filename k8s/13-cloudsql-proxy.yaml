# Cloud SQL Auth Proxy — standalone Deployment in front of Cloud SQL HA.
#
# Architecture (stage 3-A + 3-B combined):
#   backend (N pods, pool=10/5)
#     → pgbouncer (2 pods, server_pool=50, transaction mode)
#       → cloudsql-proxy (this file, 2 pods)
#         → Cloud SQL HA instance (private IP via Workload Identity)
#
# This is intentionally NOT a backend sidecar — the sidecar pattern would
# force one proxy per backend pod, exploding the connection count to
# Cloud SQL and bypassing PgBouncer's pooling. Running the proxy as a
# small Deployment keeps the ~50-connection cap from PgBouncer intact.
#
# Prerequisites (run these BEFORE kubectl apply):
#
#   1. Cloud SQL HA instance created (asia-east1, db-custom-2-7680 or larger),
#      with user "app" + database "safety_response" matching backend-secret.
#
#   2. GCP service account for the proxy:
#        PROJECT=avid-vine-496920-n4
#        gcloud iam service-accounts create safety-cloudsql-proxy \
#          --project=$PROJECT --display-name="Cloud SQL Proxy for safety-system"
#        gcloud projects add-iam-policy-binding $PROJECT \
#          --member="serviceAccount:safety-cloudsql-proxy@${PROJECT}.iam.gserviceaccount.com" \
#          --role="roles/cloudsql.client"
#
#   3. Workload Identity binding (GCP SA ↔ this k8s SA):
#        gcloud iam service-accounts add-iam-policy-binding \
#          safety-cloudsql-proxy@${PROJECT}.iam.gserviceaccount.com \
#          --project=$PROJECT \
#          --role="roles/iam.workloadIdentityUser" \
#          --member="serviceAccount:${PROJECT}.svc.id.goog[safety-system/cloudsql-proxy-sa]"
#
#   4. Add CLOUDSQL_INSTANCE_CONNECTION_NAME to k8s/02-secret.yaml:
#        CLOUDSQL_INSTANCE_CONNECTION_NAME: "PROJECT_ID:REGION:INSTANCE_NAME"
#      (kubectl get instance connection name with:
#        gcloud sql instances describe INSTANCE --format='get(connectionName)')
#
#   5. After this Deployment is healthy, switch PgBouncer's upstream:
#      patch k8s/12-pgbouncer.yaml's POSTGRESQL_HOST from "postgres" to
#      "cloudsql-proxy", then `kubectl apply -f k8s/12-pgbouncer.yaml`
#      and `kubectl rollout restart deployment/pgbouncer -n safety-system`.
#
#   6. Once the cutover is verified, delete the in-cluster Postgres:
#        kubectl delete -f k8s/03-postgres.yaml
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloudsql-proxy-sa
  namespace: safety-system
  annotations:
    # Replace PROJECT_ID at apply-time, e.g.:
    #   sed -i '' "s/PROJECT_ID/${PROJECT}/" k8s/13-cloudsql-proxy.yaml
    iam.gke.io/gcp-service-account: safety-cloudsql-proxy@avid-vine-496920-n4.iam.gserviceaccount.com
---
apiVersion: v1
kind: Service
metadata:
  name: cloudsql-proxy
  namespace: safety-system
spec:
  selector:
    app: cloudsql-proxy
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudsql-proxy
  namespace: safety-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudsql-proxy
  template:
    metadata:
      labels:
        app: cloudsql-proxy
    spec:
      serviceAccountName: cloudsql-proxy-sa
      containers:
        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2
          args:
            - "--structured-logs"
            - "--address=0.0.0.0"
            - "--port=5432"
            # Cloud SQL HA is configured with private IP only (no_assign_ip);
            # without this flag the proxy tries the public address and fails.
            - "--private-ip"
            - "$(CLOUDSQL_INSTANCE_CONNECTION_NAME)"
          env:
            - name: CLOUDSQL_INSTANCE_CONNECTION_NAME
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: CLOUDSQL_INSTANCE_CONNECTION_NAME
          ports:
            - containerPort: 5432
          readinessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
