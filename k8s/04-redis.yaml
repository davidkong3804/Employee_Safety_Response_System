# DEPRECATED (3-C) — will be replaced by Cloud Memorystore for Redis (Standard
# Tier with replica). Keep this file until Memorystore is provisioned and
# REDIS_URL in k8s/01-configmap.yaml is updated to the Memorystore private IP.
#
# Redis is provisioned because it is part of the declared stack. It is not yet
# used by application code — wire it up for caching the dashboard aggregation
# endpoints (/api/events/{id}/stats*) before it earns its keep.
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: safety-system
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: safety-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
