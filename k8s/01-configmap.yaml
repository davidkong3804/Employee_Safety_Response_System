# Non-secret backend configuration.
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: safety-system
data:
  # 3-C: Update to Cloud Memorystore private IP after provisioning.
  # gcloud redis instances describe safety-redis --region=REGION --format='get(host)'
  # Until then, keep pointing at the in-cluster redis pod (k8s/04-redis.yaml).
  REDIS_URL: "redis://172.27.0.3:6379"
  JWT_EXPIRE_MINUTES: "480"

  # CORS: the Ingress serves the SPA and /api from the same host, so requests
  # are same-origin and CORS is not exercised in normal use. Set this to your
  # real domain if you ever call the API cross-origin.
  CORS_ORIGINS: "http://localhost,https://employee-safety.duckdns.org"

  # Connection pool per backend pod.
  # 3-A: PgBouncer (k8s/12-pgbouncer.yaml) is now the DB proxy; it multiplexes
  # up to 1000 client connections into ~50 real server connections.
  # 60 pods x (10 + 5) = 900 client conns → PgBouncer → ≤50 real DB conns.
  DB_POOL_SIZE: "10"
  DB_MAX_OVERFLOW: "5"
  DB_POOL_TIMEOUT: "30"
  DB_POOL_RECYCLE: "1800"
