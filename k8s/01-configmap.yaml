# Non-secret backend configuration.
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: safety-system
data:
  REDIS_URL: "redis://redis:6379"
  JWT_EXPIRE_MINUTES: "480"

  # CORS: the Ingress serves the SPA and /api from the same host, so requests
  # are same-origin and CORS is not exercised in normal use. Set this to your
  # real domain if you ever call the API cross-origin.
  CORS_ORIGINS: "http://localhost,https://employee-safety.duckdns.org"

  # Connection pool per backend pod. Keep
  #   maxReplicas x (DB_POOL_SIZE + DB_MAX_OVERFLOW)
  # below Postgres max_connections (set to 350 in 03-postgres.yaml).
  # HPA is now 3-60; 60 x (2 + 1) = 180 connections at peak —
  # within the 350 limit until PgBouncer is deployed.
  # After PgBouncer (k8s/12-pgbouncer.yaml), raise to DB_POOL_SIZE=10,
  # DB_MAX_OVERFLOW=5 since PgBouncer multiplexes to ~50 real DB connections.
  DB_POOL_SIZE: "2"
  DB_MAX_OVERFLOW: "1"
  DB_POOL_TIMEOUT: "30"
  DB_POOL_RECYCLE: "1800"
