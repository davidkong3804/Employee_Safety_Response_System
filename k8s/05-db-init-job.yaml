# Runs once: creates tables and seeds demo data. This replaces the old
# create-tables-and-seed-on-every-pod-startup behaviour, which raced across
# replicas. The job is idempotent (create_all is checkfirst; seed_data()
# loads existing employee_ids first and inserts only the missing ones),
# so re-running after a seed expansion will safely top up new accounts.
#
# Tag: `:latest` — the CI deploy job pushes the new build to both
# backend:<sha> and backend:latest. Re-applying this Job after a deploy
# therefore picks up the newest seed code. `imagePullPolicy: Always`
# guarantees the kubelet re-pulls instead of reusing a cached digest.
#
# A Job spec is immutable — to re-run after a seed.py change:
#   kubectl -n safety-system delete job db-init && kubectl apply -f k8s/05-db-init-job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: db-init
  namespace: safety-system
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app: db-init
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: db-init
          image: asia-east1-docker.pkg.dev/avid-vine-496920-n4/safety-response/backend:latest
          imagePullPolicy: Always
          command: ["python", "-m", "app.init_db", "--seed"]
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
