# GKE Ingress — provisions a Google Cloud HTTP(S) Load Balancer.
# Path routing: /api -> backend Service, everything else -> frontend Service.
# Health checks for each backend are derived automatically from the pods'
# readiness probes (/health/ready for backend, /healthz for frontend).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: safety-system
  namespace: safety-system
  annotations:
    kubernetes.io/ingress.class: "gce"
    # --- Optional production hardening (uncomment + create the resources) ---
    # Reserve a global static IP first:  gcloud compute addresses create safety-ip --global
    # kubernetes.io/ingress.global-static-ip-name: "safety-ip"
    # networking.gke.io/managed-certificates: "safety-cert"
    # kubernetes.io/ingress.allow-http: "false"
spec:
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 8080
---
# Optional: Google-managed TLS certificate. Uncomment, set your domain, and
# reference it from the Ingress annotation above. DNS for the domain must
# point at the Ingress static IP before the certificate can provision.
