# GKE Ingress — provisions a Google Cloud HTTP(S) Load Balancer.
# Path routing: /api -> backend Service, everything else -> frontend Service.
# Health checks for each backend are derived automatically from the pods'
# readiness probes (/health/ready for backend, /healthz for frontend).
#
# HTTPS: Google-managed certificate (free, auto-renew) is provisioned for
# the DuckDNS domain below. The LB validates via HTTP-01 — so HTTP must
# stay enabled for at least the first provisioning. Once the cert is
# ACTIVE, you may flip allow-http to "false" to force HTTPS.
#
# Prerequisites (one-time, already done):
#   gcloud compute addresses create safety-ip --global --addresses=8.233.75.252
#   DuckDNS A record  employee-safety.duckdns.org -> 8.233.75.252
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: safety-system
  namespace: safety-system
  annotations:
    kubernetes.io/ingress.class: "gce"
    kubernetes.io/ingress.global-static-ip-name: "safety-ip"
    networking.gke.io/managed-certificates: "safety-cert"
spec:
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 8080
---
# Google-managed TLS certificate. Auto-renews. DNS for the listed domains
# must already resolve to the Ingress static IP (safety-ip) before this
# provisions — the cert controller validates via HTTP-01 challenge.
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: safety-cert
  namespace: safety-system
spec:
  domains:
    - employee-safety.duckdns.org
