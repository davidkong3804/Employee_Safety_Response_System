services:
  db-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: safety_response_test
      POSTGRES_USER: app
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d safety_response_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend-test:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://app:devpassword@db-test:5432/safety_response_test
      TEST_DATABASE_URL: postgresql+asyncpg://app:devpassword@db-test:5432/safety_response_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: test-secret-key
      JWT_EXPIRE_MINUTES: "480"
      CORS_ORIGINS: "http://localhost:5173"
    depends_on:
      db-test:
        condition: service_healthy
    command: pytest tests/ -v --tb=short
    volumes:
      - ./backend:/app
      - test-reports:/reports
    working_dir: /app

volumes:
  test-reports:
