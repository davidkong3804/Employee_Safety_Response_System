[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
addopts =
    -v
    --tb=short
markers =
    unit: Unit tests, no database required
    integration: Integration tests, requires PostgreSQL
filterwarnings =
    ignore::DeprecationWarning
    ignore::pytest.PytestUnraisableExceptionWarning
