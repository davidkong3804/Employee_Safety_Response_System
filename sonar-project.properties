# ===========================================================================
# SonarQube / SonarScanner Configuration File
# For Employee Safety & Response System (TypeScript React + Python FastAPI)
# ===========================================================================

# Unique project key and name within the SonarQube server
sonar.projectKey=Employee_Safety_Response_System
sonar.projectName=Employee Safety & Response System
sonar.projectVersion=1.0

# ---------------------------------------------------------------------------
# Source & Test Directories Configuration
# ---------------------------------------------------------------------------
# Path to the source directories (relative to this file)
sonar.sources=backend/app,frontend/src

# Path to the test directories
sonar.tests=backend/tests,frontend/src/__tests__

# Encoding of the source files
sonar.sourceEncoding=UTF-8

# ---------------------------------------------------------------------------
# File Exclusions
# ---------------------------------------------------------------------------
# Exclude libraries, third-party dependencies, build outputs, and E2E setups 
# to keep code quality metrics accurate and focused on core logic.
sonar.exclusions=node_modules/**,frontend/node_modules/**,backend/.venv/**,backend/venv/**,dist/**,frontend/dist/**,frontend/coverage/**,backend/htmlcov/**,tests/e2e/**,*.pdf,*.png,*.jpg,*.DS_Store,**/.pytest_cache/**,**/.ruff_cache/**,frontend/src/__tests__/**,backend/app/seed.py,frontend/src/vitest.setup.ts

# ---------------------------------------------------------------------------
# Test Coverage Exclusions
# ---------------------------------------------------------------------------
# Exclude mock seeders, setup scripts, and presentation/UI-only pages from
# test coverage calculation, focusing coverage metrics strictly on core business
# APIs, routers, and logical hooks.
sonar.coverage.exclusions=backend/app/seed.py,backend/app/init_db.py,backend/app/prune_users.py,backend/app/main.py,backend/app/cache.py,backend/app/background.py,backend/app/database.py,backend/app/dependencies.py,frontend/src/pages/admin/Analytics.tsx,frontend/src/pages/admin/UserManagement.tsx,frontend/src/pages/admin/EventManagement.tsx,frontend/src/pages/employee/Home.tsx,frontend/src/main.tsx,frontend/src/App.tsx,frontend/src/vitest.setup.ts,frontend/src/components/ErrorBoundary.tsx,frontend/src/components/HeaderBanner.tsx,frontend/src/components/GenderModal.tsx,frontend/src/components/ReminderBanner.tsx,frontend/src/components/ReminderModal.tsx

# ---------------------------------------------------------------------------
# Test Coverage Reports Configurations
# ---------------------------------------------------------------------------
# Python (Pytest-Cov XML format)
sonar.python.coverage.reportPaths=backend/coverage.xml

# JavaScript / TypeScript (Vitest LCOV format)
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# ---------------------------------------------------------------------------
# Quality Rules & Linters integration
# ---------------------------------------------------------------------------
# Point SonarQube to the frontend ESLint configuration for custom rules
sonar.eslint.eslintconfigpath=frontend/eslint.config.js
